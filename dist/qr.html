<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Land of Fire — QR kortelės spausdinimui</title>
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1f1a17;background:#e9e4de}
.tools{max-width:210mm;margin:1rem auto;padding:0 1rem;display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}
.tools button,.tools a{font:600 1rem system-ui;padding:.8rem 1.1rem;border-radius:10px;border:0;background:#a3121c;color:#fff;text-decoration:none;cursor:pointer}
.tools a{background:#fff;color:#1f1a17;border:1px solid #ccc}
.tools p{flex-basis:100%;margin:0;font-size:.9rem;color:#5a514b}
.sheet{width:210mm;height:297mm;margin:0 auto 2rem;background:#fff;display:grid;grid-template:1fr 1fr/1fr 1fr;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.card{border:1px dashed #bbb;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden}
.band{width:100%;background:#a3121c;padding:7mm 0 5mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.band img{height:24mm;width:auto;display:block;margin:auto}
h1{font:400 13mm/1 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;color:#a3121c;margin:7mm 0 1mm}
.sub{font-size:4mm;letter-spacing:.08em;color:#5a514b;margin:0}
.qr{width:52mm;height:52mm;margin:5mm 0 3mm}
.scan{font-size:3.6mm;line-height:1.45;margin:0}
.url{font-size:3mm;color:#7a716b;margin:2mm 0 0}
@media print{body{background:#fff}.tools{display:none}.sheet{margin:0;box-shadow:none}}
@media screen and (max-width:820px){.sheet{transform:scale(.45);transform-origin:top left;margin:0 0 -160mm 1rem}}
</style>
</head>
<body>
<div class="tools">
 <button onclick="print()">Spausdinti / Print</button>
 <a href="qr-korteles.pdf" download>PDF</a>
 <a href="qr.png" download>QR PNG</a>
 <a href="qr.svg" download>QR SVG</a>
 <p>A4 lapas → 4 kortelės (A6). Iškirpkite pagal punktyrą. Spausdinant pažymėkite „Background graphics“ / „Fono grafika“, mastelis 100 %.</p>
</div>
<div class="sheet" id="sheet"></div>
<template id="t">
 <div class="card">
  <div class="band"><img src="img/logo.png" alt="Land of Fire"></div>
  <h1>Meniu</h1>
  <p class="sub">МЕНЮ · MENU</p>
  <img class="qr" src="qr.svg" alt="QR: landoffire-menu.vercel.app">
  <p class="scan">Nuskenuokite telefonu<br>Отсканируйте телефоном<br>Scan with your phone</p>
  <p class="url">landoffire-menu.vercel.app</p>
 </div>
</template>
<script>const s=document.getElementById("sheet"),t=document.getElementById("t");for(let i=0;i<4;i++)s.appendChild(t.content.cloneNode(true));</script>
</body>
</html>
