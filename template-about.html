<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apie mus — Land of Fire · Azerbaijani cuisine, Vilnius</title>
<meta name="description" content="Land of Fire — Azerbaijani restaurant in Vilnius, Saltoniškių g. 34A. Kebabs over charcoal, Şah Plov, dolma. Address, phone and our legend.">
<meta name="theme-color" content="#f3ede3">
<link rel="canonical" href="{{SITE}}/apie">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" as="font" type="font/woff2" href="fonts/playfair-italic-latin.woff2" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="type.css">
<meta property="og:title" content="Land of Fire — Apie mus / About">
<meta property="og:image" content="{{SITE}}/img/og.jpg">
<script>{{EARLY}}</script>
<style>
:root{--paper:#f3ede3;--ink:#16120f;--soft:#5d544c;--red:#b3121e;--disp:"Playfair Display",Georgia,serif;--text:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--pad:clamp(1.25rem,5vw,3rem)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text)}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
[class^="l-"]{display:none}
html[data-lang=lt] .l-lt,html[data-lang=en] .l-en,html[data-lang=ru] .l-ru{display:inline}
.caps{font:600 var(--fs-label)/var(--lh-label) var(--text);letter-spacing:.1em;text-transform:uppercase}
header.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--ink);padding-top:env(safe-area-inset-top)}
.mast{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem var(--pad);max-width:1100px;margin:auto}
.word{font:italic 600 1.375rem/1.2 var(--disp);text-decoration:none;display:inline-block;padding:.65rem 0}
.word b{font-style:normal;color:var(--red)}
.langs{display:flex}
.langs button{all:unset;cursor:pointer;padding:0 .5rem;min-height:44px;min-width:2.2rem;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;font:600 var(--fs-label)/var(--lh-label) var(--text);letter-spacing:.1em;color:var(--soft);border-bottom:2px solid transparent}
.langs button[aria-pressed=true]{color:var(--ink);border-color:var(--red)}
.wrap{max-width:1100px;margin:auto;padding:0 var(--pad)}
.hero{padding-top:2rem}
.hero .kick{color:var(--red)}
.hero h1{font:400 var(--fs-h1)/var(--lh-display) var(--disp);letter-spacing:var(--tr-display);margin:.6rem 0 1.2rem;max-width:16ch}
.hero .lead{font:400 var(--fs-lead)/1.45 var(--disp);max-width:36ch;margin:0}
.hero figure{margin:2rem calc(-1 * var(--pad)) 0}
.hero figure img{width:100%;aspect-ratio:3/2;object-fit:cover}
.points{list-style:none;margin:var(--sp-6) 0 0;padding:0;display:grid;gap:0;border-top:1px solid var(--ink)}
@media (min-width:800px){.points{grid-template-columns:repeat(3,1fr);column-gap:2rem}}
.points li{padding:1.1rem 0 1.1rem 1.6rem;text-indent:-1.6rem;border-bottom:1px solid rgba(22,18,15,.18);font-size:var(--fs-body);line-height:var(--lh-body)}
.points li::before{content:"✦";color:var(--red);display:inline-block;width:1.6rem;text-indent:0}
.lg{margin-top:var(--sp-7);border-top:3px double var(--ink);padding-top:1rem}
.lg .head{display:flex;justify-content:space-between;align-items:baseline}
.lg h2 .n{color:var(--red);margin-right:.35rem}
.lg h2{font:italic 400 var(--fs-h2)/var(--lh-tight) var(--disp);margin:.4rem 0 1.2rem}

.legend-art{margin:0 0 1.4rem}.legend-art img{width:100%;height:auto;display:block;mix-blend-mode:multiply}
.legend h3{font:400 var(--fs-dish)/var(--lh-tight) var(--disp);margin:1.6rem 0 1rem;letter-spacing:-.015em}
.legend p{font:400 var(--fs-lead)/1.6 var(--disp);max-width:34em;margin:0}
.legend p::first-letter{float:left;font:400 calc(var(--fs-lead) * 1.6 * 3 - .2rem)/.8 var(--disp);color:var(--red);padding:.35rem .5rem 0 0}
@supports (initial-letter:3){.legend p::first-letter{float:none;initial-letter:3;font-size:inherit;line-height:inherit;padding:0 .5rem 0 0}}
.visit{margin-top:var(--sp-7);border-top:3px double var(--ink);padding-top:1rem;display:grid;gap:1.5rem}
@media (min-width:800px){.visit{grid-template-columns:1fr 1fr}}
.visit h2{font:italic 400 var(--fs-h2)/var(--lh-tight) var(--disp);margin:.4rem 0 0;grid-column:1/-1}
.visit dl{margin:0;display:grid;gap:1.1rem}
.visit dt{color:var(--red)}
.visit dd{margin:.25rem 0 0;font:400 var(--fs-item)/1.35 var(--disp);font-variant-numeric:lining-nums}
.visit dd a{text-decoration-thickness:1px;text-underline-offset:.2em}
.btns{display:flex;flex-direction:column;gap:.7rem;align-self:end}
.btns a{display:flex;justify-content:space-between;align-items:center;min-height:56px;padding:0 1.1rem;text-decoration:none;font:600 var(--fs-label)/var(--lh-label) var(--text);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--ink)}
.btns a.pri{background:var(--red);border-color:var(--red);color:#fff}
.stars{color:var(--red);letter-spacing:.1em}
footer{border-top:3px double var(--ink);max-width:1100px;margin:var(--sp-7) auto 0;padding:var(--sp-6) var(--pad) calc(var(--sp-7) + env(safe-area-inset-bottom));display:grid;gap:var(--sp-4);color:var(--soft);line-height:1.6}
footer p{margin:0}
footer .word{color:var(--ink);font-size:var(--fs-dish)}
footer a{color:var(--ink)}
</style>
</head>
<body>
{{ICONS}}
<header class="top"><div class="mast">
 <a class="word" href="./">Land <b>of</b> Fire</a>
 <div class="langs" role="group" aria-label="Kalba / Language / Язык"><button type="button" data-l="lt" aria-pressed="true">LT</button><button type="button" data-l="en" aria-pressed="false">EN</button><button type="button" data-l="ru" aria-pressed="false">RU</button></div>
</div></header>
<main class="wrap">
 <section class="hero">
  <p class="kick caps">{{KICKER}}</p>
  <h1>{{TITLE}}</h1>
  <p class="lead">{{LEAD}}</p>
  <figure><img src="img/hero-1600.webp" srcset="img/hero-800.webp 800w, img/hero-1600.webp 1600w" sizes="100vw" width="1600" height="1170" alt="" fetchpriority="high"></figure>
  <ul class="points">{{POINTS}}</ul>
 </section>
 <section class="lg" aria-labelledby="lgh">
  <h2 id="lgh"><span class="n">00</span> <span data-ui="legend">Legenda</span></h2>
  {{LEGENDS}}
 </section>
 <section class="visit" aria-labelledby="vh">
  <h2 id="vh" data-ui="visit">Apsilankykite</h2>
  <dl>
   <div><dt class="caps" data-ui="addr">Adresas</dt><dd><a href="{{MAPS}}" rel="noopener">{{ADDR}}</a></dd></div>
   <div><dt class="caps" data-ui="phone">Telefonas</dt><dd><a href="tel:{{TEL}}">{{PHONE}}</a></dd></div>
   <div><dt class="caps" data-ui="hours">Darbo laikas</dt><dd><a href="{{MAPS}}" rel="noopener" data-ui="hoursmap">Šiandienos darbo laiką rodo Google Maps</a></dd></div>
   <div><dt class="caps" data-ui="rating">Google įvertinimas</dt><dd><span class="stars">★</span> {{RATING}} / 5</dd></div>
  </dl>
  <div class="btns">
   <a class="pri" href="./"><span data-ui="seemenu">Žiūrėti meniu</span><span>→</span></a>
   <a href="{{MAPS}}" rel="noopener"><span data-ui="route">Maršrutas</span><span>↗</span></a>
   <a href="tel:{{TEL}}"><span data-ui="call">Skambinti</span><span>☎</span></a>
   <a href="https://www.instagram.com/{{IG}}/" rel="noopener"><span>Instagram</span><span>↗</span></a>
  </div>
 </section>
</main>
<footer>{{FOOTER}}</footer>
<script type="application/json" id="ui">{{UI}}</script>
<script src="app.js" defer></script>
</body>
</html>
